    <section id="poll">

        <div class="content">
    <div class="qtext">
        <h2>What should this character's name be?</h2>
        </div>
       

    <div class="choose">
        <label class="poll-option">
            <input type="radio" name="chname" value="Azara" required>
            <img src="../Research portfolio/purple.png" alt="">
            <span>Azara</span>
             
        </label>
        <label class="poll-option">
            <input type="radio" name="chname" value="Inferno" required>
            <img src="../Research portfolio/purple.png" alt="">
            <span>Inferno</span>
            
        </label>
        <label class="poll-option">
            <input type="radio" name="chname" value="Blaze" required>
            <img src="../Research portfolio/purple.png" alt="">
            <span>Blaze</span>
            
        </label>
        <label class="poll-option">
            <input type="radio" name="chname" value="Scorch" required>
            <img src="../Research portfolio/purple.png" alt="">
            <span>Scorch</span>
            
        </label>
        </div>
        </div>
        </div>
        
</div>
</div>
         <button type="submit">Submit</button>

        </form>
<div id="results">

        </div>
